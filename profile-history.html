<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile History — EqualizeME</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <div class="navbar-left">
                <img src="images/logo.svg" alt="EqualizeME" class="logo">
            </div>
            <div class="navbar-right">
                <button id="themeToggle" class="theme-toggle">🌙</button>
                <div class="profile-menu-wrapper">
                    <button id="profileAvatarBtn" class="profile-avatar" aria-expanded="false">
                        <img id="avatarImg" src="images/default-avatar.svg" alt="Profile">
                    </button>
                    <div id="profileDropdown" class="dropdown-menu">
                        <a href="profile.html">Profile</a>
                        <a href="profile-history.html" class="active">History</a>
                        <a href="settings.html">Settings</a>
                        <a href="#" id="logoutBtn">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="page-section">
            <h1>Auditory Profile History</h1>
            <p class="subtitle">View and compare how your listening preferences have changed over time.</p>

            <div id="historyContainer">
                <p class="loading">Loading your profile history...</p>
            </div>

            <div id="comparisonModal" class="modal" style="display: none;">
                <div class="modal-content">
                    <button class="modal-close" onclick="closeComparison()">×</button>
                    <h2>Profile Comparison</h2>
                    <div id="comparisonData"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="js/script.js"></script>
    <script>
        let profiles = [];

        async function loadHistory() {
            const container = document.getElementById('historyContainer');
            try {
                const res = await fetch('api/profile/history.php');
                if (!res.ok) {
                    container.innerHTML = '<p class="error">Could not load profile history.</p>';
                    return;
                }
                const data = await res.json();
                profiles = data.profiles;

                if (profiles.length === 0) {
                    container.innerHTML = '<p>No profiles yet. Take the listening test to create your first profile.</p>';
                    return;
                }

                let html = '<div class="profiles-table"><table>';
                html += '<tr><th>Date</th><th>Bass</th><th>Presence</th><th>Treble</th><th>Confidence</th><th>Action</th></tr>';

                for (let i = 0; i < profiles.length; i++) {
                    const p = profiles[i];
                    const date = new Date(p.created_at).toLocaleString();
                    const badge = i === 0 ? '<span class="badge-latest">Latest</span>' : '';

                    html += '<tr>';
                    html += `<td>${date} ${badge}</td>`;
                    html += `<td>${p.bass_gain > 0 ? '+' : ''}${p.bass_gain.toFixed(2)} dB</td>`;
                    html += `<td>${p.presence_gain > 0 ? '+' : ''}${p.presence_gain.toFixed(2)} dB</td>`;
                    html += `<td>${p.treble_gain > 0 ? '+' : ''}${p.treble_gain.toFixed(2)} dB</td>`;
                    html += `<td>${p.confidence_score.toFixed(1)}%</td>`;

                    if (i > 0) {
                        html += `<td><button onclick="compareProfiles(${p.id}, ${profiles[0].id})">vs Latest</button></td>`;
                    } else {
                        html += '<td>—</td>';
                    }
                    html += '</tr>';
                }

                html += '</table></div>';
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = '<p class="error">Error loading profile history.</p>';
                console.error(err);
            }
        }

        async function compareProfiles(oldId, newId) {
            const modal = document.getElementById('comparisonModal');
            const data = document.getElementById('comparisonData');

            try {
                const res = await fetch(`api/profile/compare.php?p1=${oldId}&p2=${newId}`);
                if (!res.ok) {
                    data.innerHTML = '<p class="error">Could not load comparison.</p>';
                    modal.style.display = 'block';
                    return;
                }
                const comparison = await res.json();

                const band = (name, older, newer, change) => {
                    const arrow = change > 0 ? '↑' : change < 0 ? '↓' : '→';
                    const color = change > 0 ? 'green' : change < 0 ? 'red' : 'gray';
                    return `
                        <div class="band-row">
                            <strong>${name}</strong>
                            <span>${older > 0 ? '+' : ''}${older.toFixed(2)} dB</span>
                            <span class="arrow" style="color: ${color}">${arrow}</span>
                            <span>${newer > 0 ? '+' : ''}${newer.toFixed(2)} dB</span>
                            <span class="change">${change > 0 ? '+' : ''}${change.toFixed(2)} dB</span>
                        </div>
                    `;
                };

                let html = '<div class="comparison">';
                html += '<div class="comparison-header">';
                html += `<div><strong>Earlier</strong><br>${new Date(comparison.older.created_at).toLocaleString()}</div>`;
                html += `<div><strong>Recent</strong><br>${new Date(comparison.newer.created_at).toLocaleString()}</div>`;
                html += '</div>';

                html += '<div class="band-changes">';
                html += band('Bass', comparison.older.bass_gain, comparison.newer.bass_gain, comparison.changes.bass_gain);
                html += band('Presence', comparison.older.presence_gain, comparison.newer.presence_gain, comparison.changes.presence_gain);
                html += band('Treble', comparison.older.treble_gain, comparison.newer.treble_gain, comparison.changes.treble_gain);
                html += '</div>';

                html += '<div class="confidence-change">';
                html += `<strong>Confidence</strong><br>`;
                html += `${comparison.older.confidence_score.toFixed(1)}% → ${comparison.newer.confidence_score.toFixed(1)}%`;
                const confChange = comparison.changes.confidence_change;
                if (confChange !== 0) {
                    html += ` (${confChange > 0 ? '+' : ''}${confChange.toFixed(1)}%)`;
                }
                html += '</div>';

                html += '</div>';
                data.innerHTML = html;
                modal.style.display = 'block';
            } catch (err) {
                data.innerHTML = '<p class="error">Error comparing profiles.</p>';
                console.error(err);
                modal.style.display = 'block';
            }
        }

        function closeComparison() {
            document.getElementById('comparisonModal').style.display = 'none';
        }

        document.addEventListener('click', (e) => {
            if (e.target === document.getElementById('comparisonModal')) {
                closeComparison();
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            await fetch('api/auth/logout.php', { method: 'POST' });
            window.location.href = 'login.php';
        });

        loadHistory();
    </script>

    <style>
        .profiles-table table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .profiles-table th, .profiles-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color, #ddd);
        }

        .profiles-table th {
            background: var(--bg-secondary, #f5f5f5);
            font-weight: bold;
        }

        .badge-latest {
            display: inline-block;
            background: #4CAF50;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.85em;
            margin-left: 8px;
        }

        .profiles-table button {
            padding: 6px 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .profiles-table button:hover {
            background: #0056b3;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            position: relative;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] .modal-content {
            background: #1e1e1e;
            color: #e0e0e0;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #666;
        }

        .comparison {
            margin-top: 20px;
        }

        .comparison-header {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color, #ddd);
        }

        .band-changes {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .band-row {
            display: grid;
            grid-template-columns: 60px 1fr 30px 1fr 80px;
            gap: 10px;
            align-items: center;
            padding: 10px;
            background: var(--bg-secondary, #f9f9f9);
            border-radius: 4px;
        }

        .band-row strong {
            font-weight: 600;
        }

        .band-row span {
            text-align: center;
        }

        .band-row .arrow {
            font-size: 1.2em;
            font-weight: bold;
        }

        .band-row .change {
            font-weight: 600;
            font-size: 0.95em;
        }

        .confidence-change {
            padding: 15px;
            background: var(--bg-secondary, #f9f9f9);
            border-radius: 4px;
            text-align: center;
        }

        .confidence-change strong {
            display: block;
            margin-bottom: 8px;
        }

        .error {
            color: #d32f2f;
            padding: 15px;
            background: #ffebee;
            border-radius: 4px;
        }

        .loading {
            color: #666;
            font-style: italic;
        }

        .subtitle {
            color: var(--text-secondary, #666);
            margin-bottom: 30px;
        }

        @media (max-width: 600px) {
            .profiles-table {
                font-size: 0.9em;
            }

            .profiles-table th, .profiles-table td {
                padding: 8px;
            }

            .band-row {
                grid-template-columns: 50px 1fr 20px 1fr 60px;
                font-size: 0.9em;
            }

            .modal-content {
                padding: 20px;
            }
        }
    </style>
</body>
</html>
