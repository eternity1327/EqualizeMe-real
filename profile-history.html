<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Profile History — EqualizeME</title>
    <script>if(localStorage.getItem("theme")==="dark"){document.documentElement.setAttribute("data-theme","dark");}</script>
    <link rel="stylesheet" href="css/style.css">
    <style>

      :root {
        --change-up: #1f9d55;
        --change-flat: var(--text-muted);
      }
      [data-theme="dark"] {
        --change-up: #4ade80;
      }

      .history-box {
        max-width: 900px;
        margin: 0 auto;
        text-align: left;
      }

      .history-card {
        background: var(--card-bg);
        border-radius: 30px;
        box-shadow: 0 15px 35px var(--shadow-color);
        padding: 12px;
        overflow: hidden;
      }

      .history-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
        padding: 18px 20px;
        border-radius: 20px;
      }

      .history-row + .history-row {
        border-top: 1px solid var(--border);
      }

      .history-row-head {
        color: var(--text-muted);
        font-weight: 600;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: .04em;
      }

      .history-date {
        flex: 1 1 200px;
        font-weight: 600;
      }

      .history-metric {
        flex: 1 1 90px;
        color: var(--text-muted);
      }

      .history-row:not(.history-row-head) .history-metric {
        color: var(--text);
      }

      .history-action {
        flex: 0 0 auto;
        margin-left: auto;
      }

      .badge-latest {
        display: inline-block;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: white;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 0.75em;
        font-weight: 600;
        margin-left: 8px;
        vertical-align: middle;
      }

      .btn-compare {
        padding: 8px 18px;
        background: var(--pill-bg);
        color: var(--text);
        border: none;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.85em;
        font-weight: 600;
        font-family: inherit;
      }

      .btn-compare:hover {
        background: var(--pill-bg-hover);
        color: white;
      }

      .btn-compare:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .empty-dash {
        color: var(--text-muted);
      }

      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, .5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }

      .modal-content {
        background: var(--card-bg);
        color: var(--text);
        padding: 35px;
        border-radius: 30px;
        max-width: 500px;
        width: 90%;
        position: relative;
        box-shadow: 0 15px 35px var(--shadow-color);
        text-align: left;
      }

      .modal-close {
        position: absolute;
        top: 14px;
        right: 18px;
        background: none;
        border: none;
        font-size: 26px;
        line-height: 1;
        cursor: pointer;
        color: var(--text-muted);
      }

      .modal-close:hover {
        color: var(--text);
      }

      .comparison {
        margin-top: 20px;
      }

      .comparison-header {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 25px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border);
      }

      .comparison-header strong {
        color: var(--text-muted);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: .04em;
      }

      .band-changes {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 20px;
      }

      /* Scoped to .comparison deliberately. css/style.css already defines a
         .band-row for the match bars on recommendation cards, using a
         three-column grid. An unscoped rule here would be loaded after it
         and quietly restyle those cards on any page that loaded this file. */
      .comparison .band-row {
        display: grid;
        grid-template-columns: 60px 1fr 30px 1fr 80px;
        gap: 10px;
        align-items: center;
        padding: 12px;
        background: var(--pill-bg);
        border-radius: 14px;
      }

      .comparison .band-row strong {
        font-weight: 600;
      }

      .comparison .band-row span {
        text-align: center;
      }

      .comparison .band-row .arrow {
        font-size: 1.2em;
        font-weight: bold;
      }

      .comparison .band-row .change {
        font-weight: 600;
        font-size: 0.95em;
      }

      .confidence-change {
        padding: 16px;
        background: var(--pill-bg);
        border-radius: 14px;
        text-align: center;
      }

      .confidence-change strong {
        display: block;
        margin-bottom: 8px;
      }

      .history-note {
        margin-top: 18px;
        font-size: 0.85rem;
        color: var(--text-muted);
        line-height: 1.6;
      }

      .error {
        color: var(--danger);
        padding: 15px;
        background: var(--pill-bg);
        border-radius: 14px;
      }

      .loading {
        color: var(--text-muted);
        font-style: italic;
      }

      .subtitle {
        color: var(--text-muted);
        margin: -30px auto 30px;
        text-align: left;
        max-width: 900px;
      }

      @media (max-width: 700px) {
        .history-row-head {
          display: none;
        }

        .history-row {
          flex-direction: column;
          align-items: flex-start;
          gap: 6px;
        }

        .history-action {
          margin-left: 0;
        }

        .comparison .band-row {
          grid-template-columns: 50px 1fr 20px 1fr 60px;
          font-size: 0.9em;
        }

        .modal-content {
          padding: 22px;
        }
      }
    </style>
  </head>
  <body>

    <nav class="navbar">

      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="EqualizeME logo" class="logo-light">
        <img src="images/logo-dark.png" alt="EqualizeME logo" class="logo-dark">
      </a>

      <ul class="nav-links">
        <li><a href="test.html">Sound Test</a></li>
        <li><a href="recommendations.html">Recommendations</a></li>
        <li><a href="settings.html">Settings</a></li>
      </ul>

      <div class="nav-right">
        <div class="profile-menu">
          <button class="profile-avatar" id="profileAvatarBtn"
            aria-haspopup="true" aria-expanded="false">
            👤
          </button>
          <div class="dropdown" id="profileDropdown">
            <a href="profile.html" id="nav-profile">Profile</a>
            <a href="profile-history.html" id="nav-history" class="active">History</a>
            <a href="login.php" id="nav-login" style="display:none;">Login</a>
            <a href="login.php?tab=register" id="nav-register" style="display:none;">Register</a>
            <a href="logout.php" id="nav-logout" class="dropdown-logout"
              style="display:none;">Logout</a>
          </div>
        </div>
      </div>

      <button id="themeToggle" class="theme-toggle"
        aria-label="Toggle dark mode">🌙</button>

    </nav>

    <section class="section">

      <h1 class="section-title">Auditory Profile History</h1>
      <p class="subtitle">View and compare how your listening preferences have
        changed over time.</p>

      <div class="history-box">
        <div id="historyContainer">
          <p class="loading">Loading your profile history...</p>
        </div>
      </div>

      <div id="comparisonModal" class="modal" style="display: none;"
        role="dialog" aria-modal="true" aria-labelledby="comparisonTitle">
        <div class="modal-content">
          <button class="modal-close" onclick="closeComparison()"
            aria-label="Close comparison">×</button>
          <h2 id="comparisonTitle">Profile Comparison</h2>
          <div id="comparisonData"></div>
        </div>
      </div>

    </section>

    <script src="js/script.js"></script>
    <script>
      let profiles = [];

      // Remembers what had focus before the modal opened, so it can be
      // handed back on close rather than dropping the user at the top of
      // the page.
      let lastFocused = null;

      // Values arrive as JSON numbers, but a malformed or missing field
      // would otherwise throw on .toFixed and blank the whole page.
      function db(value, places = 2) {
        const n = Number(value);
        if (!Number.isFinite(n)) return "—";
        return `${n > 0 ? "+" : ""}${n.toFixed(places)} dB`;
      }

      function percent(value) {
        const n = Number(value);
        return Number.isFinite(n) ? `${n.toFixed(1)}%` : "—";
      }

      function formatDate(value) {
        const d = new Date(value);
        return Number.isNaN(d.getTime()) ? String(value ?? "") : d.toLocaleString();
      }

      // Timestamps and gain figures come from our own database, but they are
      // still being pushed through innerHTML, so escape on principle rather
      // than relying on the data always being clean.
      function esc(value) {
        return String(value ?? "").replace(/[&<>"']/g, ch => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[ch]));
      }

      async function loadHistory() {
        const container = document.getElementById('historyContainer');

        try {
          const res = await fetch('api/profile/history.php');

          if (res.status === 401) {
            container.innerHTML =
              '<p>Please <a href="login.php?redirect=profile.html">log in</a> to see your profile history.</p>';
            return;
          }

          if (!res.ok) {
            container.innerHTML = '<p class="error">Could not load profile history.</p>';
            return;
          }

          const data = await res.json();
          profiles = Array.isArray(data.profiles) ? data.profiles : [];

          if (profiles.length === 0) {
            container.innerHTML =
              '<p>No profiles yet. Take the <a href="test.html">listening test</a> to create your first one.</p>';
            return;
          }

          container.innerHTML = renderHistory(profiles);
        } catch (err) {
          container.innerHTML = '<p class="error">Error loading profile history.</p>';
          console.error(err);
        }
      }

      function renderHistory(rows) {
        let html = '<div class="history-card">';

        html += '<div class="history-row history-row-head">';
        html += '<span class="history-date">Date</span>';
        html += '<span class="history-metric">Bass</span>';
        html += '<span class="history-metric">Presence</span>';
        html += '<span class="history-metric">Treble</span>';
        html += '<span class="history-metric">Confidence</span>';
        html += '<span class="history-action"></span>';
        html += '</div>';

        rows.forEach((p, i) => {
          const badge = i === 0 ? '<span class="badge-latest">Latest</span>' : '';

          html += '<div class="history-row">';
          html += `<span class="history-date">${esc(formatDate(p.created_at))}${badge}</span>`;
          html += `<span class="history-metric">${db(p.bass_gain)}</span>`;
          html += `<span class="history-metric">${db(p.presence_gain)}</span>`;
          html += `<span class="history-metric">${db(p.treble_gain)}</span>`;
          html += `<span class="history-metric">${percent(p.confidence_score)}</span>`;

          if (i > 0) {
            html += '<span class="history-action">'
              + `<button class="btn-compare" onclick="compareProfiles(${Number(p.id)}, ${Number(rows[0].id)})">`
              + 'vs Latest</button></span>';
          } else {
            html += '<span class="history-action empty-dash">—</span>';
          }

          html += '</div>';
        });

        html += '</div>';

        if (rows.length === 1) {
          html += '<p class="history-note">Only one profile so far. Retake the '
            + '<a href="test.html">listening test</a> to build a history you can compare against.</p>';
        }

        return html;
      }

      async function compareProfiles(oldId, newId) {
        const modal = document.getElementById('comparisonModal');
        const target = document.getElementById('comparisonData');

        lastFocused = document.activeElement;

        try {
          const res = await fetch(`api/profile/compare.php?p1=${oldId}&p2=${newId}`);

          if (!res.ok) {
            target.innerHTML = '<p class="error">Could not load comparison.</p>';
            openModal(modal);
            return;
          }

          target.innerHTML = renderComparison(await res.json());
          openModal(modal);
        } catch (err) {
          target.innerHTML = '<p class="error">Error comparing profiles.</p>';
          console.error(err);
          openModal(modal);
        }
      }

      function bandRow(name, older, newer, change) {
        const delta = Number(change) || 0;
        const arrow = delta > 0 ? '↑' : delta < 0 ? '↓' : '→';
        const colour = delta > 0
          ? 'var(--change-up)'
          : delta < 0 ? 'var(--danger)' : 'var(--change-flat)';

        return `
          <div class="band-row">
            <strong>${esc(name)}</strong>
            <span>${db(older)}</span>
            <span class="arrow" style="color: ${colour}">${arrow}</span>
            <span>${db(newer)}</span>
            <span class="change" style="color: ${colour}">${db(delta)}</span>
          </div>`;
      }

      function renderComparison(c) {
        let html = '<div class="comparison">';

        html += '<div class="comparison-header">';
        html += `<div><strong>Earlier</strong><br>${esc(formatDate(c.older.created_at))}</div>`;
        html += `<div><strong>Recent</strong><br>${esc(formatDate(c.newer.created_at))}</div>`;
        html += '</div>';

        html += '<div class="band-changes">';
        html += bandRow('Bass', c.older.bass_gain, c.newer.bass_gain, c.changes.bass_gain);
        html += bandRow('Presence', c.older.presence_gain, c.newer.presence_gain, c.changes.presence_gain);
        html += bandRow('Treble', c.older.treble_gain, c.newer.treble_gain, c.changes.treble_gain);
        html += '</div>';

        html += '<div class="confidence-change">';
        html += '<strong>Confidence</strong>';
        html += `${percent(c.older.confidence_score)} → ${percent(c.newer.confidence_score)}`;

        const confChange = Number(c.changes.confidence_change) || 0;
        if (confChange !== 0) {
          html += ` (${confChange > 0 ? '+' : ''}${confChange.toFixed(1)}%)`;
        }

        html += '</div>';
        html += '</div>';

        return html;
      }

      function openModal(modal) {
        modal.style.display = 'flex';
        const close = modal.querySelector('.modal-close');
        if (close) close.focus();
      }

      function closeComparison() {
        document.getElementById('comparisonModal').style.display = 'none';
        if (lastFocused && typeof lastFocused.focus === 'function') {
          lastFocused.focus();
        }
        lastFocused = null;
      }

      // Click the backdrop to dismiss.
      document.addEventListener('click', (e) => {
        if (e.target === document.getElementById('comparisonModal')) {
          closeComparison();
        }
      });

      // Escape to dismiss, which is what people reach for first.
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        const modal = document.getElementById('comparisonModal');
        if (modal && modal.style.display !== 'none') closeComparison();
      });

      loadHistory();
    </script>
  </body>
</html>
