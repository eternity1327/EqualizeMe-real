<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2090" viewBox="0 0 1280 2090" font-family="Helvetica, Arial, sans-serif">

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7fafd"/>
      <stop offset="100%" stop-color="#eef3f8"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8fa3"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f7a55"/>
    </marker>
  </defs>

  <rect width="1280" height="2090" fill="url(#sky)"/>

  <!-- ================= TITLE ================= -->
  <text x="64" y="76" font-size="38" font-weight="bold" fill="#14202e">How EqualizeME finds your sound</text>
  <text x="64" y="110" font-size="17" fill="#5d6f83">Six written questions, ten listening comparisons, and a shelf full of measured earphones.</text>
  <line x1="64" y1="132" x2="1216" y2="132" stroke="#14202e" stroke-width="3"/>

  <!-- ================= STEP 1 ================= -->
  <g transform="translate(64,168)">
    <circle cx="26" cy="26" r="26" fill="#14202e"/>
    <text x="26" y="35" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
    <text x="70" y="24" font-size="23" font-weight="bold" fill="#14202e">You make an account</text>
    <text x="70" y="50" font-size="15" fill="#5d6f83">Email and a password. Nothing about your ears yet — the app knows nothing about you.</text>

    <!-- person -->
    <g transform="translate(80,86)">
      <circle cx="34" cy="26" r="21" fill="#c7dcf0" stroke="#5b87b5" stroke-width="2.5"/>
      <path d="M4,80 a30,34 0 0 1 60,0 z" fill="#c7dcf0" stroke="#5b87b5" stroke-width="2.5"/>
    </g>
    <!-- form card -->
    <g transform="translate(210,80)">
      <rect width="230" height="88" rx="12" fill="#fff" stroke="#c4d3e2" stroke-width="2"/>
      <rect x="18" y="20" width="120" height="11" rx="5" fill="#dde7f1"/>
      <rect x="18" y="42" width="194" height="11" rx="5" fill="#dde7f1"/>
      <rect x="18" y="64" width="86" height="12" rx="6" fill="#5b87b5"/>
    </g>
    <text x="470" y="132" font-size="15" fill="#8595a7">stored as a bcrypt hash — even we can't read it</text>
  </g>

  <!-- ================= STEP 2 ================= -->
  <g transform="translate(64,368)">
    <circle cx="26" cy="26" r="26" fill="#14202e"/>
    <text x="26" y="35" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
    <text x="70" y="24" font-size="23" font-weight="bold" fill="#14202e">Six quick questions — no audio yet</text>
    <text x="70" y="50" font-size="15" fill="#5d6f83">Plain-language taste questions. These give the listening test a head start.</text>

    <g transform="translate(80,80)">
      <rect width="470" height="46" rx="10" fill="#fff" stroke="#c4d3e2" stroke-width="2"/>
      <text x="18" y="29" font-size="15" fill="#2c3e50">"What do you listen to most?"</text>
      <rect x="330" y="12" width="124" height="22" rx="11" fill="#e6f0e9"/>
      <text x="392" y="28" font-size="13" fill="#2f7a55" text-anchor="middle">Hip-hop / EDM</text>

      <rect y="58" width="470" height="46" rx="10" fill="#fff" stroke="#c4d3e2" stroke-width="2"/>
      <text x="18" y="87" font-size="15" fill="#2c3e50">"Do cymbals ever feel sharp?"</text>
      <rect x="330" y="70" width="124" height="22" rx="11" fill="#e6f0e9"/>
      <text x="392" y="86" font-size="13" fill="#2f7a55" text-anchor="middle">Sometimes</text>

      <rect y="116" width="470" height="46" rx="10" fill="#fff" stroke="#c4d3e2" stroke-width="2"/>
      <text x="18" y="145" font-size="15" fill="#2c3e50">"Ideal sound?"</text>
      <rect x="330" y="128" width="124" height="22" rx="11" fill="#e6f0e9"/>
      <text x="392" y="144" font-size="13" fill="#2f7a55" text-anchor="middle">Warm and full</text>
    </g>

    <path d="M574,160 L648,160" stroke="#7d8fa3" stroke-width="2.5" marker-end="url(#ar)"/>

    <g transform="translate(664,104)">
      <rect width="300" height="116" rx="14" fill="#fff8ec" stroke="#e0b86a" stroke-width="2.5"/>
      <text x="150" y="30" font-size="14" font-weight="bold" fill="#7a5410" text-anchor="middle">A STARTING GUESS</text>
      <text x="24" y="60" font-size="15" fill="#5a3d07">Bass</text>
      <text x="150" y="60" font-size="15" font-weight="bold" fill="#5a3d07">+3 dB</text>
      <text x="24" y="84" font-size="15" fill="#5a3d07">Treble</text>
      <text x="150" y="84" font-size="15" font-weight="bold" fill="#5a3d07">−1 dB</text>
      <text x="24" y="106" font-size="15" fill="#5a3d07">Presence</text>
      <text x="150" y="106" font-size="15" font-weight="bold" fill="#5a3d07">0 dB</text>
    </g>
    <text x="990" y="168" font-size="14" fill="#8595a7">a guess, not an answer —</text>
    <text x="990" y="188" font-size="14" fill="#8595a7">it just narrows where to look</text>
  </g>

  <!-- ================= STEP 3 ================= -->
  <g transform="translate(64,608)">
    <circle cx="26" cy="26" r="26" fill="#14202e"/>
    <text x="26" y="35" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
    <text x="70" y="24" font-size="23" font-weight="bold" fill="#14202e">Ten times: which sounds better, A or B?</text>
    <text x="70" y="50" font-size="15" fill="#5d6f83">Same music clip, two different EQ settings. You just pick the one you prefer.</text>

    <!-- headphones -->
    <g transform="translate(96,96)">
      <path d="M6,52 a44,44 0 0 1 88,0" fill="none" stroke="#14202e" stroke-width="7" stroke-linecap="round"/>
      <rect x="-8" y="50" width="28" height="44" rx="12" fill="#14202e"/>
      <rect x="80" y="50" width="28" height="44" rx="12" fill="#14202e"/>
    </g>

    <!-- card A -->
    <g transform="translate(250,86)">
      <rect width="230" height="140" rx="16" fill="#fff" stroke="#c4d3e2" stroke-width="2.5"/>
      <text x="115" y="42" font-size="34" font-weight="bold" fill="#14202e" text-anchor="middle">A</text>
      <g stroke="#5b87b5" stroke-width="5" stroke-linecap="round">
        <line x1="66" y1="82" x2="66" y2="96"/>
        <line x1="86" y1="72" x2="86" y2="106"/>
        <line x1="106" y1="62" x2="106" y2="116"/>
        <line x1="126" y1="76" x2="126" y2="102"/>
        <line x1="146" y1="86" x2="146" y2="92"/>
      </g>
      <text x="115" y="128" font-size="14" fill="#8595a7" text-anchor="middle">less bass</text>
    </g>

    <text x="512" y="166" font-size="26" font-weight="bold" fill="#8595a7">vs</text>

    <!-- card B -->
    <g transform="translate(560,86)">
      <rect width="230" height="140" rx="16" fill="#fff" stroke="#2f7a55" stroke-width="3"/>
      <text x="115" y="42" font-size="34" font-weight="bold" fill="#14202e" text-anchor="middle">B</text>
      <g stroke="#2f7a55" stroke-width="5" stroke-linecap="round">
        <line x1="66" y1="66" x2="66" y2="112"/>
        <line x1="86" y1="58" x2="86" y2="120"/>
        <line x1="106" y1="52" x2="106" y2="126"/>
        <line x1="126" y1="62" x2="126" y2="116"/>
        <line x1="146" y1="74" x2="146" y2="104"/>
      </g>
      <text x="115" y="128" font-size="14" fill="#2f7a55" text-anchor="middle" font-weight="bold">more bass  ✓ picked</text>
    </g>

    <g transform="translate(838,120)">
      <rect width="150" height="72" rx="12" fill="#14202e"/>
      <text x="75" y="32" font-size="27" font-weight="bold" fill="#fff" text-anchor="middle">× 10</text>
      <text x="75" y="55" font-size="13" fill="#a9bcd0" text-anchor="middle">comparisons</text>
    </g>
    <text x="1010" y="150" font-size="14" fill="#8595a7">you must play both</text>
    <text x="1010" y="170" font-size="14" fill="#8595a7">before you can choose</text>
  </g>

  <!-- ================= STEP 4 : THE BIG IDEA ================= -->
  <g transform="translate(64,880)">
    <rect width="1152" height="392" rx="20" fill="#14202e"/>
    <circle cx="42" cy="44" r="26" fill="#fff"/>
    <text x="42" y="53" font-size="24" font-weight="bold" fill="#14202e" text-anchor="middle">4</text>
    <text x="86" y="42" font-size="23" font-weight="bold" fill="#fff">Each answer throws away half the possibilities</text>
    <text x="86" y="68" font-size="15" fill="#9fb3c8">This is why ten questions is enough. It's the same trick as guessing a number between 1 and 100.</text>

    <!-- ruler rounds -->
    <g transform="translate(120,104)" font-size="13">
      <!-- round 1 -->
      <text x="-56" y="20" fill="#7f95ab">start</text>
      <rect x="0" y="8" width="760" height="18" rx="9" fill="#31465c"/>
      <rect x="380" y="8" width="380" height="18" rx="9" fill="#4b9e78"/>
      
      <text x="0" y="46" fill="#7f95ab">−6 dB</text>
      <text x="740" y="46" fill="#7f95ab">+6 dB</text>
      <text x="790" y="23" fill="#8fd3b0">you picked B → it's in the top half</text>

      <!-- round 2 -->
      <rect x="380" y="62" width="380" height="18" rx="9" fill="#31465c"/>
      <rect x="380" y="62" width="190" height="18" rx="9" fill="#4b9e78"/>
      <text x="-56" y="76" fill="#7f95ab">round 2</text>
      <text x="790" y="77" fill="#8fd3b0">picked A → lower half of what's left</text>

      <!-- round 3 -->
      <rect x="380" y="116" width="190" height="18" rx="9" fill="#31465c"/>
      <rect x="475" y="116" width="95" height="18" rx="9" fill="#4b9e78"/>
      <text x="-56" y="130" fill="#7f95ab">round 3</text>
      <text x="790" y="131" fill="#8fd3b0">picked B</text>

      <!-- round 4 -->
      <rect x="475" y="170" width="95" height="18" rx="9" fill="#31465c"/>
      <rect x="475" y="170" width="48" height="18" rx="9" fill="#7fe0b0"/>
      <text x="-56" y="184" fill="#7f95ab">round 4</text>
      <text x="790" y="185" fill="#8fd3b0">picked A</text>

      <!-- answer -->
      <line x1="499" y1="196" x2="499" y2="216" stroke="#7fe0b0" stroke-width="2.5"/>
      <text x="499" y="236" font-size="17" font-weight="bold" fill="#7fe0b0" text-anchor="middle">+1.9 dB</text>
      <text x="499" y="256" font-size="12.5" fill="#7f95ab" text-anchor="middle">your bass preference, ± 0.4 dB</text>
    </g>
  </g>

  <!-- ================= STEP 5 ================= -->
  <g transform="translate(64,1312)">
    <circle cx="26" cy="26" r="26" fill="#14202e"/>
    <text x="26" y="35" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
    <text x="70" y="24" font-size="23" font-weight="bold" fill="#14202e">Your sound profile — three numbers</text>
    <text x="70" y="50" font-size="15" fill="#5d6f83">That's the whole result. Everything after this is matching.</text>

    <g transform="translate(96,84)">
      <rect width="420" height="150" rx="16" fill="#fff" stroke="#c4d3e2" stroke-width="2.5"/>
      <g font-size="14">
        <text x="26" y="42" fill="#2c3e50">Bass</text>
        <rect x="120" y="30" width="220" height="14" rx="7" fill="#e8eef5"/>
        <rect x="230" y="30" width="62" height="14" rx="7" fill="#2f7a55"/>
        <text x="356" y="42" font-weight="bold" fill="#14202e">+1.9</text>

        <text x="26" y="86" fill="#2c3e50">Presence</text>
        <rect x="120" y="74" width="220" height="14" rx="7" fill="#e8eef5"/>
        <rect x="196" y="74" width="34" height="14" rx="7" fill="#c25b4a"/>
        <text x="356" y="86" font-weight="bold" fill="#14202e">−0.8</text>

        <text x="26" y="130" fill="#2c3e50">Treble</text>
        <rect x="120" y="118" width="220" height="14" rx="7" fill="#e8eef5"/>
        <rect x="230" y="118" width="24" height="14" rx="7" fill="#2f7a55"/>
        <text x="356" y="130" font-weight="bold" fill="#14202e">+0.6</text>
      </g>
      <line x1="230" y1="20" x2="230" y2="142" stroke="#b9c8d8" stroke-width="1.5" stroke-dasharray="4 4"/>
    </g>
    <text x="536" y="150" font-size="14" fill="#8595a7">the dotted line is "neutral"</text>
    <text x="536" y="172" font-size="14" fill="#8595a7">— left of it is less, right is more</text>
    <text x="536" y="204" font-size="14" fill="#2f7a55" font-weight="bold">Confidence: 94.8%</text>
  </g>

  <!-- ================= STEP 6 ================= -->
  <g transform="translate(64,1566)">
    <circle cx="26" cy="26" r="26" fill="#14202e"/>
    <text x="26" y="35" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">6</text>
    <text x="70" y="24" font-size="23" font-weight="bold" fill="#14202e">Compared against a shelf of measured earphones</text>
    <text x="70" y="50" font-size="15" fill="#5d6f83">Every IEM has a lab measurement. We line yours up against all of them and score the distance.</text>

    <!-- shelf -->
    <g transform="translate(96,82)">
      <rect x="0" y="86" width="440" height="8" rx="4" fill="#c4a882"/>
      <g>
        <g transform="translate(20,40)"><circle cx="16" cy="26" r="16" fill="#8fa8c0"/><path d="M16,10 q14,-14 22,2" fill="none" stroke="#8fa8c0" stroke-width="6" stroke-linecap="round"/></g>
        <g transform="translate(90,40)"><circle cx="16" cy="26" r="16" fill="#a5b9cd"/><path d="M16,10 q14,-14 22,2" fill="none" stroke="#a5b9cd" stroke-width="6" stroke-linecap="round"/></g>
        <g transform="translate(160,40)"><circle cx="16" cy="26" r="16" fill="#2f7a55"/><path d="M16,10 q14,-14 22,2" fill="none" stroke="#2f7a55" stroke-width="6" stroke-linecap="round"/></g>
        <g transform="translate(230,40)"><circle cx="16" cy="26" r="16" fill="#a5b9cd"/><path d="M16,10 q14,-14 22,2" fill="none" stroke="#a5b9cd" stroke-width="6" stroke-linecap="round"/></g>
        <g transform="translate(300,40)"><circle cx="16" cy="26" r="16" fill="#8fa8c0"/><path d="M16,10 q14,-14 22,2" fill="none" stroke="#8fa8c0" stroke-width="6" stroke-linecap="round"/></g>
        <g transform="translate(370,40)"><circle cx="16" cy="26" r="16" fill="#a5b9cd"/><path d="M16,10 q14,-14 22,2" fill="none" stroke="#a5b9cd" stroke-width="6" stroke-linecap="round"/></g>
      </g>
      <text x="220" y="118" font-size="14" fill="#8595a7" text-anchor="middle">hundreds of models, each with a measured frequency curve</text>
    </g>

    <path d="M572,140 L640,140" stroke="#7d8fa3" stroke-width="2.5" marker-end="url(#ar)"/>

    <g transform="translate(660,74)">
      <rect width="330" height="150" rx="14" fill="#fff" stroke="#c4d3e2" stroke-width="2"/>
      <text x="20" y="30" font-size="14" font-weight="bold" fill="#5d6f83">TWO-STAGE RANKING</text>
      <text x="20" y="60" font-size="14.5" fill="#2c3e50">1.  Take the 15 closest matches</text>
      <text x="20" y="88" font-size="14.5" fill="#2c3e50">2.  Re-sort those by price</text>
      <text x="20" y="116" font-size="14.5" fill="#2c3e50">3.  Show the best 5</text>
      <text x="20" y="138" font-size="12.5" fill="#8595a7">so you get a good match you can afford</text>
    </g>
  </g>

  <!-- ================= STEP 7 ================= -->
  <g transform="translate(64,1826)">
    <circle cx="26" cy="26" r="26" fill="#2f7a55"/>
    <text x="26" y="35" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">7</text>
    <text x="70" y="24" font-size="23" font-weight="bold" fill="#14202e">Your five recommendations</text>
    <text x="70" y="50" font-size="15" fill="#5d6f83">Each with a match score, the price in pesos, and a chart of its curve against yours.</text>

    <g transform="translate(96,74)">
      <g>
        <rect width="196" height="86" rx="12" fill="#fff" stroke="#2f7a55" stroke-width="2.5"/>
        <text x="16" y="28" font-size="14" font-weight="bold" fill="#14202e">Truthear Zero</text>
        <text x="16" y="50" font-size="13" fill="#2f7a55" font-weight="bold">Match 96%</text>
        <text x="16" y="72" font-size="13" fill="#5d6f83">₱3,200</text>
      </g>
      <g transform="translate(216,0)">
        <rect width="196" height="86" rx="12" fill="#fff" stroke="#c4d3e2" stroke-width="2"/>
        <text x="16" y="28" font-size="14" font-weight="bold" fill="#14202e">Moondrop Chu</text>
        <text x="16" y="50" font-size="13" fill="#2f7a55" font-weight="bold">Match 93%</text>
        <text x="16" y="72" font-size="13" fill="#5d6f83">₱1,300</text>
      </g>
      <g transform="translate(432,0)">
        <rect width="196" height="86" rx="12" fill="#fff" stroke="#c4d3e2" stroke-width="2"/>
        <text x="16" y="28" font-size="14" font-weight="bold" fill="#14202e">7Hz Salnotes Zero</text>
        <text x="16" y="50" font-size="13" fill="#2f7a55" font-weight="bold">Match 91%</text>
        <text x="16" y="72" font-size="13" fill="#5d6f83">₱1,500</text>
      </g>
      <g transform="translate(648,0)" opacity="0.55">
        <rect width="196" height="86" rx="12" fill="#fff" stroke="#c4d3e2" stroke-width="2"/>
        <text x="16" y="28" font-size="14" font-weight="bold" fill="#14202e">Tangzu Wan'er</text>
        <text x="16" y="50" font-size="13" fill="#2f7a55" font-weight="bold">Match 89%</text>
        <text x="16" y="72" font-size="13" fill="#5d6f83">₱1,150</text>
      </g>
      <text x="880" y="52" font-size="30" fill="#b9c8d8">…</text>
    </g>

    <text x="96" y="196" font-size="14" fill="#8595a7">Take the test again in a month and the History page will show you exactly what changed.</text>
  </g>

</svg>
