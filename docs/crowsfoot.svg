  <!-- iems 0..N —— 0..1 retailers -->
  <path class="r" d="M770 600 H960"/>
  <circle class="r" cx="806" cy="600" r="6.5" fill="#f7f8fa"/>
  <path class="r" d="M770 600 L792 587 M770 600 L792 600 M770 600 L792 613"/>
  <circle class="r" cx="924" cy="600" r="6.5" fill="#f7f8fa"/>
  <line class="r" x1="941" y1="587" x2="941" y2="613"/>
  <text class="rl" x="845" y="593">sold by</text>


</svg>
