<!DOCTYPE html>
<html>

    <head>
        <meta charset="UTF-8">
        <title>Settings</title>

        <script>if(localStorage.getItem("theme")==="dark"){document.documentElement.setAttribute("data-theme","dark");}</script>
        <link rel="stylesheet" href="css/style.css?v=20260903">

    </head>

    <body>

        <nav class="navbar">

            <a href="index.html" class="logo">
                <img src="images/logo.png" alt="EqualizeME logo"
                    class="logo-light">
                <img src="images/logo-dark.png" alt="EqualizeME logo"
                    class="logo-dark">
            </a>

            <ul class="nav-links">
                <li><a href="test.html">Sound Test</a></li>
                <li><a href="recommendations.html">Recommendations</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>

            <div class="nav-right">
                <div class="profile-menu">
                    <button class="profile-avatar" id="profileAvatarBtn"
                        aria-haspopup="true" aria-expanded="false">
                        👤
                    </button>
                    <div class="dropdown" id="profileDropdown">
                        <a href="profile.html" id="nav-profile">Profile</a>
                        <a href="profile-history.html" id="nav-history" style="display:none;">History</a>
                        <a href="login.php" id="nav-login">Login</a>
                        <a href="login.php?tab=register" id="nav-register">Register</a>
                        <a href="logout.php" id="nav-logout"
                            class="dropdown-logout"
                            style="display:none;">Logout</a>
                    </div>
                </div>
            </div>

            <button id="themeToggle" class="theme-toggle"
                aria-label="Toggle dark mode">🌙</button>

        </nav>

        <section class="section">

            <h1 class="section-title">
                Settings
            </h1>

            <div class="settings-box">

                <div class="setting">

                    <p>Notifications</p>

                    <input type="checkbox" class="setting-checkbox"
                        data-key="notifications"
                        onchange="toggleNotifications(this.checked)">

                </div>
                <p id="notif-status" style="font-size:0.85rem;color:var(--text-muted);margin:-8px 0 0;"></p>

                <div class="setting">

                    <p>Auto Play</p>

                    <input type="checkbox" class="setting-checkbox"
                        data-key="autoPlay"
                        onchange="saveSetting('autoPlay', this.checked)">

                </div>

            </div>

            <!-- Two-factor sits in its own box rather than as a fourth
                 checkbox. It is a credential, not a preference: turning it
                 on takes a phone and turning it off takes the password,
                 neither of which fits a toggle that saves on change. -->
            <div class="settings-box tfa-box" id="tfa-box" hidden>

                <div class="setting">
                    <p>Two-Factor Authentication</p>
                    <span class="tfa-state" id="tfa-state">—</span>
                </div>

                <p class="tfa-note" id="tfa-note">
                    Ask for a code from an authenticator app as well as your
                    password. Optional — your password alone still works until
                    you turn this on.
                </p>

                <button type="button" class="auth-submit tfa-action" id="tfa-action"
                        onclick="handleTwoFactorAction()">Turn On</button>

                <!-- Only shown when switching off. The password is what
                     proves it is really you and not a borrowed session. -->
                <div id="tfa-disable-form" hidden>
                    <label for="tfa-password">Confirm your password to turn it off</label>
                    <input id="tfa-password" type="password" autocomplete="current-password">
                    <button type="button" class="auth-submit tfa-action"
                            onclick="confirmTwoFactorOff()">Turn Off</button>
                    <button type="button" class="tfa-cancel"
                            onclick="cancelTwoFactorOff()">Cancel</button>
                </div>

                <p class="tfa-status" id="tfa-status"></p>

            </div>

        </section>

        <script src="js/script.js?v=20260903"></script>

    </body>
</html>
