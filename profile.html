<!DOCTYPE html>
<html>

  <head>

    <meta charset="UTF-8">
    <title>Profile</title>

    <script>if(localStorage.getItem("theme")==="dark"){document.documentElement.setAttribute("data-theme","dark");}</script>
    <link rel="stylesheet" href="css/style.css">
    <style>
      .profile-image-outer {
        cursor: pointer;
        position: relative;
        width: 120px;
        margin: auto auto 20px;
      }

      .profile-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .profile-image .placeholder-icon {
        font-size: 42px;
      }

      .profile-image-outer .edit-badge {
        position: absolute;
        bottom: 2px;
        right: 2px;
        background: var(--accent);
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid var(--card-bg);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #picture-status {
        font-size: 0.85rem;
        color: var(--text-muted);
        margin-top: 8px;
        min-height: 18px;
      }
    </style>

  </head>

  <body>

    <nav class="navbar">

      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="EqualizeME logo" class="logo-light">
        <img src="images/logo-dark.png" alt="EqualizeME logo" class="logo-dark">
      </a>

      <ul class="nav-links">
        <li><a href="test.html">Sound Test</a></li>
        <li><a href="recommendations.html">Recommendations</a></li>
        <li><a href="settings.html">Settings</a></li>
      </ul>

      <div class="nav-right">
        <div class="profile-menu">
          <button class="profile-avatar" id="profileAvatarBtn"
            aria-haspopup="true" aria-expanded="false">
            👤
          </button>
          <div class="dropdown" id="profileDropdown">
            <a href="profile.html" id="nav-profile">Profile</a>
            <a href="profile-history.html" id="nav-history" style="display:none;">History</a>
            <a href="login.php" id="nav-login">Login</a>
            <a href="login.php?tab=register" id="nav-register">Register</a>
            <a href="logout.php" id="nav-logout" class="dropdown-logout"
              style="display:none;">Logout</a>
          </div>
        </div>
      </div>

      <button id="themeToggle" class="theme-toggle"
        aria-label="Toggle dark mode">🌙</button>

    </nav>

    <section class="section">

      <h1 class="section-title">
        My Profile
      </h1>

      <div class="profile-card">

        <div class="profile-image-outer" id="profile-picture-wrap"
          title="Click to change photo">
          <div class="profile-image">
            <span class="placeholder-icon"
              id="profile-picture-placeholder">👤</span>
            <img id="profile-picture-img" style="display:none;"
              alt="Profile picture">
          </div>
          <span class="edit-badge">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
              stroke="white" stroke-width="3" stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </span>
        </div>
        <input type="file" id="profile-picture-input"
          accept="image/png, image/jpeg, image/webp" style="display:none;">
        <div id="picture-status"></div>

        <h2 id="profile-name">
          User
        </h2>

        <p>
          Preferred Tuning:
          <span id="profile-sound">-</span>
        </p>

      </div>

    </section>

    <script src="js/script.js"></script>
    <script>
      loadProfile();

      // ===== Profile picture upload =====
      (function () {
        const wrap = document.getElementById('profile-picture-wrap');
        const input = document.getElementById('profile-picture-input');
        const status = document.getElementById('picture-status');

        if (!wrap || !input) return;

        wrap.addEventListener('click', () => input.click());

        input.addEventListener('change', async () => {
          const file = input.files[0];
          if (!file) return;

          status.textContent = 'Uploading...';

          const formData = new FormData();
          formData.append('photo', file);
          // Multipart request, so the CSRF token travels as a form field
          // rather than a header (getCsrfToken lives in js/script.js).
          formData.append('csrf_token', (await getCsrfToken()) || '');

          try {
            const res = await fetch('api/upload-picture.php', {
              method: 'POST',
              body: formData
            });
            const data = await res.json();

            if (!res.ok) {
              status.textContent = data.error || 'Upload failed';
              return;
            }

            setProfilePicture(data.profilePicture);
            status.textContent = 'Photo updated.';
            setTimeout(() => { status.textContent = ''; }, 2500);
          } catch (err) {
            status.textContent = 'Upload failed. Try again.';
            console.error(err);
          }
        });
      })();

      // Shared by the upload handler and loadProfile() (in script.js) if it sets a picture
      function setProfilePicture(path) {
        const img = document.getElementById('profile-picture-img');
        const placeholder = document.getElementById('profile-picture-placeholder');
        if (!img || !placeholder) return;

        if (path) {
          img.src = path + '?t=' + Date.now(); // cache-bust so a new upload shows immediately
          img.style.display = 'block';
          placeholder.style.display = 'none';
        } else {
          img.style.display = 'none';
          placeholder.style.display = 'block';
        }
      }
    </script>

  </body>
</html>
