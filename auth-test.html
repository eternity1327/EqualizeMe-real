<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Auth test</title>
    <style>
  body { font-family: system-ui, sans-serif; max-width: 400px; margin: 60px auto; }
  input { display: block; width: 100%; padding: 8px; margin: 6px 0 12px; box-sizing: border-box; }
  button { padding: 10px 16px; margin-right: 8px; cursor: pointer; }
  #status { margin-top: 20px; padding: 12px; background: #f3f4f6; border-radius: 6px; white-space: pre-wrap; font-family: monospace; font-size: 0.85rem; }
</style>
  </head>
  <body>
    <h2>Register</h2>
    <input id="reg-name" placeholder="Name">
    <input id="reg-email" placeholder="Email">
    <input id="reg-password" type="password"
      placeholder="Password (min 8 chars)">
    <button onclick="register()">Register</button>

    <h2>Login</h2>
    <input id="login-email" placeholder="Email">
    <input id="login-password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>

    <h2>Session</h2>
    <button onclick="whoAmI()">Who am I?</button>
    <button onclick="logout()">Logout</button>

    <div id="status">Status will show here.</div>

    <script>
async function post(url, body) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  const data = await res.json();
  document.getElementById('status').textContent = `${res.status} ${url}\n${JSON.stringify(data, null, 2)}`;
}

function register() {
  post('api/auth/register.php', {
    name: document.getElementById('reg-name').value,
    email: document.getElementById('reg-email').value,
    password: document.getElementById('reg-password').value,
  });
}

function login() {
  post('api/auth/login.php', {
    email: document.getElementById('login-email').value,
    password: document.getElementById('login-password').value,
  });
}

async function whoAmI() {
  const res = await fetch('api/auth/me.php');
  const data = await res.json();
  document.getElementById('status').textContent = `${res.status} api/auth/me.php\n${JSON.stringify(data, null, 2)}`;
}

function logout() {
  post('api/auth/logout.php');
}
</script>
  </body>
</html>
