# Python code style configuration.
#
# The project follows PEP 8, the official Python style guide, checked with
# flake8. Anyone can verify it from the project root:
#
#     pip install flake8
#     python -m flake8 backend/
#
# A clean run means the code conforms. This is deliberately checkable
# rather than a claim in a document — a reviewer can confirm it in one
# command instead of taking our word for it.

[flake8]
# PEP 8's default is 79 characters, but it explicitly allows a team to
# agree on up to 99. We use 99: this codebase has long, descriptive names
# (catalogue_baseline, presence_gain, CANDIDATE_POOL_SIZE) and SQL
# fragments that read worse when broken across lines to satisfy 79.
# Comments and docstrings are still kept near 72 as PEP 8 recommends.
max-line-length = 99

exclude =
    .venv,
    __pycache__,
    .git,
    lib

# E203: whitespace before ':' — conflicts with how Black formats slices.
# Listed for completeness; not currently triggered.
extend-ignore = E203
